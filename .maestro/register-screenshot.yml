# 스크린샷 등록: App Store 구독 목록 다녀오기 → 사진 보관함에서 고르기 → 분석 → 불러온 구독 등록 → 구독 관리에 보임
# 분석 결과는 목서버 고정값 (mocks/handlers/subscription.ts screenshots/analyses: 등록 가능 YouTube Premium)
appId: com.subscribers.gudogging
---
- addMedia:
    - 'assets/subscription-list.png' # 사진 보관함 맨 앞(가장 최근)에 들어감
- runFlow: subflows/login.yml
- tapOn:
    id: 'home-add'
- tapOn:
    id: 'register-method-screenshot'
- tapOn:
    id: 'screenshot-guide-open' # App Store 구독 목록을 Safari로 열고 앱을 떠남
- launchApp:
    stopApp: false
- tapOn:
    id: 'screenshot-guide-add'
- tapOn:
    id: 'screenshot-images-add'
# iOS 사진 보관함(시스템 화면)이라 testID가 없음 → 언어와 무관한 셀 id의 첫 칸, 버튼은 문구로
- tapOn:
    id: 'PXGGridLayout-Info'
    index: 0
- tapOn: '완료|Done'
- tapOn:
    id: 'screenshot-images-analyze'
- tapOn:
    id: 'register-found-submit'
- tapOn:
    id: 'register-done'
- assertVisible: '2개 구독 중이에요' # 시드 Netflix + YouTube Premium
- tapOn:
    id: 'tab-manage'
- assertVisible: 'YouTube Premium.*'
