name: Create Branch on Issue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '브랜치를 만들 GitHub 이슈 번호'
        required: true

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    # 템플릿 이슈 또는 jira-to-issue에서 호출한 경우만 처리 (빈 이슈는 건너뜀)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.body, '브랜치 접두사')
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue, create branch, link Jira
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # ---- Jira 연동 (없으면 Jira 관련 단계만 건너뜀) ----
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_FIELD_GITHUB: ${{ vars.JIRA_FIELD_GITHUB }}
          JIRA_STATUS_PROGRESS: ${{ vars.JIRA_STATUS_PROGRESS || '진행' }} # 브랜치 생성 시 옮길 상태 (none = 안 옮김)
        run: |
          set -euo pipefail

          # ---- workflow_dispatch로 호출되면 이슈 정보를 직접 읽음 ----
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="$INPUT_ISSUE"
            J=$(gh issue view "$ISSUE_NUMBER" --json title,body,url)
            ISSUE_TITLE=$(printf '%s' "$J" | jq -r '.title')
            ISSUE_BODY=$(printf '%s' "$J" | jq -r '.body')
            ISSUE_URL=$(printf '%s' "$J" | jq -r '.url')
          fi

          # "### ... <라벨>" 헤더 바로 아래의 첫 번째 값 줄을 읽음
          field() {
            printf '%s\n' "$ISSUE_BODY" | tr -d '\r' | awk -v key="$1" '
              /^### / { found = (index($0, key) > 0); next }
              found && NF && !done { print; done = 1 }
            ' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g'
          }

          TICKET=$(field "Jira 티켓" | tr '[:lower:]' '[:upper:]')
          TYPE=$(field "타입")
          PREFIX=$(field "브랜치 접두사")
          WORK=$(field "브랜치에 포함될 작업 내용")

          if [ "$TICKET" = "_NO RESPONSE_" ]; then TICKET=""; fi

          echo "TICKET=${TICKET}, TYPE=${TYPE}, PREFIX=${PREFIX}, WORK=${WORK}"

          # ---- 값 검증 ----
          if ! [[ "$TYPE" =~ ^[A-Z]+$ ]]; then
            echo "::error::Invalid TYPE: $TYPE"; exit 1
          fi
          if ! [[ "$PREFIX" =~ ^[a-z0-9_-]+$ ]]; then
            echo "::error::Invalid PREFIX: $PREFIX"; exit 1
          fi
          if ! [[ "$WORK" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid WORK: $WORK"; exit 1
          fi
          if [ -n "$TICKET" ] && ! [[ "$TICKET" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]]; then
            echo "::error::Invalid TICKET: $TICKET"; exit 1
          fi

          # ---- Jira 연동 준비 ----
          JIRA_OK=""
          if [ -n "$TICKET" ] && [ -n "$JIRA_BASE_URL" ] && [ -n "$JIRA_EMAIL" ] && [ -n "$JIRA_API_TOKEN" ]; then
            JIRA_OK="1"
            API="${JIRA_BASE_URL%/}/rest/api/2/issue/${TICKET}"
          else
            echo "Jira 설정이 없어 Jira 연동 단계는 건너뜁니다."
          fi

          jira() {
            curl -fsS -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
              -H "Accept: application/json" -H "Content-Type: application/json" "$@"
          }
          transition() {  # $1: 옮길 상태 이름(일부만 써도 됨, 예: 진행 / 리뷰 / 완료)
            local want="$1" list tid
            if [ -z "$want" ] || [ "$want" = "none" ]; then return 0; fi
            if ! list=$(jira "${API}/transitions"); then
              echo "::warning::Jira 상태 목록 조회 실패"; return 0
            fi
            tid=$(printf '%s' "$list" | jq -r --arg s "$want" \
              '[.transitions[] | select((.to.name // .name) | contains($s))][0].id // empty')
            if [ -z "$tid" ]; then
              echo "::warning::'${want}' 상태로 옮길 수 없습니다 (상태 이름 확인)"; return 0
            fi
            if jira -X POST "${API}/transitions" -d "$(jq -n --arg id "$tid" '{transition: {id: $id}}')" > /dev/null; then
              echo "Jira ${TICKET} → '${want}' 상태로 이동"
            else
              echo "::warning::Jira 상태 변경 실패"
            fi
          }

          # ---- Jira 서브태스크 제목, GitHub 이슈 칸 가져오기 ----
          JIRA_SUMMARY=""
          LINKED=""
          if [ -n "$JIRA_OK" ]; then
            FIELDS="summary"
            if [ -n "$JIRA_FIELD_GITHUB" ]; then FIELDS="${FIELDS},${JIRA_FIELD_GITHUB}"; fi
            if RES=$(jira "${API}?fields=${FIELDS}"); then
              JIRA_SUMMARY=$(printf '%s' "$RES" | jq -r '.fields.summary // ""')
              if [ -n "$JIRA_FIELD_GITHUB" ]; then
                LINKED=$(printf '%s' "$RES" | jq -r --arg f "$JIRA_FIELD_GITHUB" '.fields[$f] // ""')
              fi
            else
              echo "::warning::Jira 티켓 ${TICKET} 조회 실패 (번호, 이메일, 토큰 확인)"
            fi
          fi

          # ---- 브랜치명 / 제목 태그 ----
          if [ -n "$TICKET" ]; then
            BRANCH_NAME="${PREFIX}/#${ISSUE_NUMBER}-${TICKET}-${WORK}"
            TAG="${TICKET}/${TYPE}"
          else
            BRANCH_NAME="${PREFIX}/#${ISSUE_NUMBER}-${WORK}"
            TAG="${TYPE}"
          fi

          # ---- 제목 정리 ----
          # 맨 앞 [...] 태그를 [티켓/타입]으로 교체, 내용이 비었거나 '작업 내용' 그대로면 Jira 제목으로 채움
          REST=$(printf '%s' "$ISSUE_TITLE" | sed -E 's/^\[[^]]*\][[:space:]]*//')
          if { [ -z "$REST" ] || [ "$REST" = "작업 내용" ]; } && [ -n "$JIRA_SUMMARY" ]; then
            REST="$JIRA_SUMMARY"
          fi
          NEW_TITLE="[${TAG}] ${REST}"
          if [ "$NEW_TITLE" != "$ISSUE_TITLE" ]; then
            gh issue edit "$ISSUE_NUMBER" --title "$NEW_TITLE"
            echo "Title updated: $NEW_TITLE"
          fi

          # ---- 브랜치 생성 (checkout 없이 API로) ----
          SHA=$(gh api "repos/${GH_REPO}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')
          if ! gh api "repos/${GH_REPO}/git/refs" \
                -f ref="refs/heads/${BRANCH_NAME}" -f sha="$SHA" > /dev/null; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "⚠️ 브랜치 생성에 실패했습니다: \`${BRANCH_NAME}\` (이미 존재하는지 확인해주세요)"
            exit 1
          fi

          # ---- GitHub 이슈 코멘트 ----
          MSG="🪵 브랜치가 생성되었습니다: \`${BRANCH_NAME}\`"
          if [ -n "$TICKET" ] && [ -n "$JIRA_BASE_URL" ]; then
            MSG+=$'\n'"🎫 Jira: ${JIRA_BASE_URL%/}/browse/${TICKET}"
          fi
          MSG+=$'\n\n''```bash'$'\n'"git fetch origin && git switch ${BRANCH_NAME}"$'\n''```'
          gh issue comment "$ISSUE_NUMBER" --body "$MSG"

          # ---- Jira: 링크 댓글, GitHub 이슈 칸 채우기, 상태 이동 ----
          if [ -n "$JIRA_OK" ]; then
            BRANCH_URL="https://github.com/${GH_REPO}/tree/${BRANCH_NAME//#/%23}"
            TEXT=$(printf '🔗 GitHub 이슈: [#%s|%s]\n🪵 브랜치: [%s|%s]' \
              "$ISSUE_NUMBER" "$ISSUE_URL" "$BRANCH_NAME" "$BRANCH_URL")
            if jira -X POST "${API}/comment" -d "$(jq -n --arg b "$TEXT" '{body: $b}')" > /dev/null; then
              echo "Jira ${TICKET}에 댓글을 남겼습니다."
            else
              echo "::warning::Jira 댓글 작성 실패 (브랜치는 정상 생성됨)"
            fi

            # 깃허브 템플릿으로 직접 만든 경우에도 Jira에 연결 기록 (중복 생성 방지)
            if [ -n "$JIRA_FIELD_GITHUB" ] && [ -z "$LINKED" ]; then
              jira -X PUT "$API" \
                -d "$(jq -n --arg f "$JIRA_FIELD_GITHUB" --arg u "$ISSUE_URL" '{fields: {($f): $u}}')" > /dev/null \
                || echo "::warning::Jira 'GitHub 이슈' 칸 업데이트 실패"
            fi

            transition "$JIRA_STATUS_PROGRESS"
          fi
