name: Design Token Branch Sync

# 디자이너가 언제든 푸시할 수 있도록 design-token 브랜치를 유지 (삭제되면 dev 에서 재생성)
# reset 대신 merge 해서 아직 PR 에 안 올라간 커밋을 보존
on:
  push:
    branches: [dev]
  delete:
  workflow_dispatch:

permissions:
  contents: write

# design-token.yml 과 동시 푸시 방지
concurrency:
  group: design-token
  cancel-in-progress: false

env:
  BASE_BRANCH: dev
  HEAD_BRANCH: design-token

jobs:
  sync:
    if: github.event_name != 'delete' || (github.event.ref_type == 'branch' && github.event.ref == 'design-token')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DESIGN_TOKEN_PAT || github.token }}

      - name: Merge dev into design-token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$HEAD_BRANCH" > /dev/null; then
            git fetch origin "$HEAD_BRANCH"
            git checkout -B "$HEAD_BRANCH" "origin/${HEAD_BRANCH}"
            if ! git merge --no-edit "origin/${BASE_BRANCH}" -m "[CHORE] design-token 브랜치 dev 동기화"; then
              echo "::error::${BASE_BRANCH} → ${HEAD_BRANCH} 머지 충돌. 로컬에서 충돌을 해결해 주세요."
              exit 1
            fi
          else
            echo "${HEAD_BRANCH} 브랜치가 없어 ${BASE_BRANCH} 에서 새로 만듭니다."
            git checkout -B "$HEAD_BRANCH" "origin/${BASE_BRANCH}"
          fi

          git push origin "HEAD:${HEAD_BRANCH}"
